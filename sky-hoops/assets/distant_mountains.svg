<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400">
  <!-- Montagne in lontananza (tonalità azzurro-indaco atmosferico) -->
  <!-- Seamless: inizio a (0, 240) e fine a (1280, 240) -->
  <path d="M 0 240 
           L 180 140 
           L 360 260 
           L 540 100 
           L 720 250 
           L 920 120 
           L 1100 230 
           L 1280 240 
           L 1280 400 
           L 0 400 Z" 
        fill="#5e60ce" opacity="0.35"/>

  <!-- Creste montuose secondarie -->
  <path d="M 0 280 
           L 240 200 
           L 460 290 
           L 680 180 
           L 860 280 
           L 1040 190 
           L 1280 280 
           L 1280 400 
           L 0 400 Z" 
        fill="#48bfe3" opacity="0.3"/>
</svg>
