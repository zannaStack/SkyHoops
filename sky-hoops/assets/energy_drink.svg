  <!-- Riflesso bianco lucido -->
  <path d="M 14 18 L 18 18 L 18 70 L 14 70 Z" fill="#ffffff" opacity="0.4" rx="2" />

  <!-- Fulmine Elettrico Centrale Iconico -->
