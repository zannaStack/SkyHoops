<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="goldGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff59d" />
      <stop offset="45%" stop-color="#fbc02d" />
      <stop offset="85%" stop-color="#f57f17" />
      <stop offset="100%" stop-color="#c43e00" />
    </radialGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#bf360c" />
    </linearGradient>
  </defs>

  <!-- Bordo Esterno Moneta -->
  <circle cx="50" cy="50" r="46" fill="url(#rimGrad)" stroke="#5d2200" stroke-width="3" />
  
  <!-- Faccia Principale Moneta -->
  <circle cx="50" cy="50" r="40" fill="url(#goldGrad)" stroke="#8c3800" stroke-width="2" />
  
  <!-- Bordo Interno Lavorato -->
  <circle cx="50" cy="50" r="33" fill="none" stroke="#ffe082" stroke-width="2" stroke-dasharray="6,4" opacity="0.8" />
  
  <!-- Stella / Simbolo Centrale Dorato -->
  <polygon points="50,22 58,38 76,41 63,53 66,71 50,62 34,71 37,53 24,41 42,38" fill="#fff9c4" stroke="#e65100" stroke-width="1.5" />
  
  <!-- Brillio Superiore -->
  <ellipse cx="36" cy="28" rx="12" ry="5" transform="rotate(-30 36 28)" fill="#ffffff" opacity="0.5" />
</svg>