<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <!-- Outer radial gold glow -->
    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF275" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#FFD700" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#FFA500" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FF8C00" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Radiant gold ring gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#FFE066" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#FFB703" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FB8500" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Star flare filter -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Ambient outer soft halo -->
  <circle cx="80" cy="80" r="76" fill="url(#goldGlow)" />
  
  <!-- Outer glowing ring -->
  <circle cx="80" cy="80" r="64" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-dasharray="8 6" opacity="0.85" filter="url(#softBlur)"/>
  <circle cx="80" cy="80" r="64" fill="none" stroke="url(#ringGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.95"/>

  <!-- Inner sacred ring -->
  <circle cx="80" cy="80" r="54" fill="none" stroke="#FFF7B2" stroke-width="2" opacity="0.75" />

  <!-- 4 Cardinal celestial sparks -->
  <polygon points="80,14 84,26 80,38 76,26" fill="#FFFBE6" opacity="0.9"/>
  <polygon points="80,122 84,134 80,146 76,134" fill="#FFFBE6" opacity="0.9"/>
  <polygon points="14,80 26,84 38,80 26,76" fill="#FFFBE6" opacity="0.9"/>
  <polygon points="122,80 134,84 146,80 134,76" fill="#FFFBE6" opacity="0.9"/>

  <!-- 4 Diagonal micro sparks -->
  <circle cx="34" cy="34" r="3" fill="#FFFBE6" opacity="0.8"/>
  <circle cx="126" cy="34" r="3" fill="#FFFBE6" opacity="0.8"/>
  <circle cx="34" cy="126" r="3" fill="#FFFBE6" opacity="0.8"/>
  <circle cx="126" cy="126" r="3" fill="#FFFBE6" opacity="0.8"/>
</svg>