<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 140" width="90" height="140">
  <defs>
    <!-- Cardboard/mesh body gradient -->
    <linearGradient id="dummyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="60%" stop-color="#E64A19"/>
      <stop offset="100%" stop-color="#BF360C"/>
    </linearGradient>

    <!-- Metal pole/spring gradient -->
    <linearGradient id="poleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#757575"/>
      <stop offset="50%" stop-color="#EEEEEE"/>
      <stop offset="100%" stop-color="#424242"/>
    </linearGradient>

    <!-- Hand gloves gradient -->
    <linearGradient id="gloveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFEB3B"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="1" dy="3" stdDeviation="2" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Ground base plate -->
  <ellipse cx="45" cy="136" rx="28" ry="4" fill="#212121" opacity="0.6"/>
  <rect x="25" y="132" width="40" height="5" rx="2" fill="#424242" stroke="#616161" stroke-width="1"/>

  <!-- Heavy spring at base -->
  <path d="M 45 132 L 38 126 L 52 120 L 38 114 L 52 108 L 45 104" 
        fill="none" stroke="url(#poleGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Main Body Silhouette (Torso & Jersey) -->
  <g filter="url(#dropShadow)">
    <!-- Shoulders and chest -->
    <path d="M 28 65 Q 45 60 62 65 L 58 105 L 32 105 Z" fill="url(#dummyGrad)" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Jersey trim & Number 00 -->
    <path d="M 37 63 Q 45 70 53 63" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
    <text x="45" y="88" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="16" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">D</text>
    <rect x="34" y="94" width="22" height="3" rx="1.5" fill="#FFEB3B"/>

    <!-- Head / Cardboard face -->
    <circle cx="45" cy="48" r="14" fill="#FF8A65" stroke="#FFFFFF" stroke-width="2"/>
    <!-- Headband -->
    <path d="M 31 44 Q 45 42 59 44 L 58 48 Q 45 46 32 48 Z" fill="#D32F2F"/>
    
    <!-- Game face eyes (determined glare) -->
    <polygon points="36,49 41,51 37,53" fill="#212121"/>
    <polygon points="54,49 49,51 53,53" fill="#212121"/>
    <!-- Grin / mouthguard -->
    <path d="M 40 56 Q 45 59 50 56" fill="none" stroke="#212121" stroke-width="2" stroke-linecap="round"/>

    <!-- RAISED ARMS & HIGH BLOCKING HANDS -->
    <!-- Left Arm reaching up -->
    <path d="M 28 65 Q 16 42 20 22" fill="none" stroke="url(#dummyGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 28 65 Q 16 42 20 22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Left Hand / Giant Foam Hand -->
    <g transform="translate(19, 14) rotate(-15)">
      <rect x="-8" y="-12" width="16" height="18" rx="4" fill="url(#gloveGrad)" stroke="#E65100" stroke-width="1.5"/>
      <!-- Fingers -->
      <line x1="-5" y1="-12" x2="-5" y2="-17" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
      <line x1="-1" y1="-12" x2="-1" y2="-19" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
      <line x1="3" y1="-12" x2="3" y2="-18" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
      <line x1="7" y1="-8" x2="11" y2="-12" stroke="#E65100" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Right Arm reaching up -->
    <path d="M 62 65 Q 74 42 70 22" fill="none" stroke="url(#dummyGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M 62 65 Q 74 42 70 22" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <!-- Right Hand / Giant Foam Hand -->
    <g transform="translate(71, 14) rotate(15)">
      <rect x="-8" y="-12" width="16" height="18" rx="4" fill="url(#gloveGrad)" stroke="#E65100" stroke-width="1.5"/>
      <!-- Fingers -->
      <line x1="5" y1="-12" x2="5" y2="-17" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
      <line x1="1" y1="-12" x2="1" y2="-19" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
      <line x1="-3" y1="-12" x2="-3" y2="-18" stroke="#E65100" stroke-width="3" stroke-linecap="round"/>
      <line x1="-7" y1="-8" x2="-11" y2="-12" stroke="#E65100" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>
</svg>