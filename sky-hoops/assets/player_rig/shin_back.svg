<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
<defs>
  <!-- Sfumatura Pelle Calda Tanned / Caricatura -->
  <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fed7aa" />
    <stop offset="40%" stop-color="#fb923c" />
    <stop offset="85%" stop-color="#ea580c" />
    <stop offset="100%" stop-color="#c2410c" />
  </linearGradient>
  <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ea580c" />
    <stop offset="70%" stop-color="#c2410c" />
    <stop offset="100%" stop-color="#9a3412" />
  </linearGradient>
  <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.1"/>
  </linearGradient>

  <!-- Canotta e Pantaloncini Royal Blue (Dunk City) -->
  <linearGradient id="jerseyBlue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3b82f6" />
    <stop offset="45%" stop-color="#1d4ed8" />
    <stop offset="100%" stop-color="#1e3a8a" />
  </linearGradient>
  <linearGradient id="jerseyFold" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.7"/>
    <stop offset="50%" stop-color="#1d4ed8" stop-opacity="0"/>
    <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.4"/>
  </linearGradient>

  <!-- Bordo Oro / Giallo Caldo -->
  <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fef08a" />
    <stop offset="35%" stop-color="#facc15" />
    <stop offset="80%" stop-color="#eab308" />
    <stop offset="100%" stop-color="#ca8a04" />
  </linearGradient>

  <!-- Capelli Castani Sfumati con Texture a Ciuffi -->
  <linearGradient id="hairDark" x1="0%" y1="100%" x2="0%" y2="0%">
    <stop offset="0%" stop-color="#1c1917" />
    <stop offset="60%" stop-color="#292524" />
    <stop offset="100%" stop-color="#44403c" />
  </linearGradient>

  <!-- Fascia Bianca Sudore -->
  <linearGradient id="sweatbandWhite" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" />
    <stop offset="65%" stop-color="#f1f5f9" />
    <stop offset="100%" stop-color="#cbd5e1" />
  </linearGradient>

  <!-- Gocce di Sudore Cristalline -->
  <linearGradient id="sweatDrop" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
    <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.85" />
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
  </linearGradient>

  <!-- Ginocchiera e Guanti Sportivi Neri -->
  <linearGradient id="gearBlack" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3f3f46" />
    <stop offset="55%" stop-color="#27272a" />
    <stop offset="100%" stop-color="#18181b" />
  </linearGradient>

  <!-- Sneaker Tomaia Grigio / Blu Scuro & Intersuola Bianca -->
  <linearGradient id="sneakerUpper" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#475569" />
    <stop offset="50%" stop-color="#334155" />
    <stop offset="100%" stop-color="#1e293b" />
  </linearGradient>
  <linearGradient id="soleWhite" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" />
    <stop offset="70%" stop-color="#e2e8f0" />
    <stop offset="100%" stop-color="#94a3b8" />
  </linearGradient>
</defs>
  <circle cx="8" cy="6" r="4.8" fill="url(#gearBlack)" stroke="#09090b" stroke-width="0.8"/>
  <!-- Polpaccio posteriore in ombra -->
  <path d="M 4 6 Q 12 13 14 21 Q 9 24 3 21 Q 1 14 4 6 Z" fill="url(#skinShadow)" stroke="#7c2d12" stroke-width="1"/>

  <!-- Calzino alto posteriore con strisce blu -->
  <path d="M 3 20 L 13 22 L 12 26 L 2 24 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="0.7"/>
  <line x1="5" y1="21" x2="6.5" y2="24.5" stroke="#2563eb" stroke-width="1.2"/>
  <line x1="8" y1="21.5" x2="9.5" y2="25" stroke="#2563eb" stroke-width="1.2"/>

  <!-- Sneaker Posteriore -->
  <path d="M 12 21 L 22 24 L 20 32 Q 14 34 3 33 L 1 27 L 7 21 Z" fill="url(#sneakerUpper)" stroke="#0f172a" stroke-width="1.1"/>
  <path d="M 1 32 L 20 33 L 21 36 L 0 35 Z" fill="url(#soleWhite)" stroke="#cbd5e1" stroke-width="0.8"/>
  <line x1="0" y1="35.5" x2="21" y2="36.5" stroke="#1e293b" stroke-width="1.2"/>
  <rect x="5" y="30" width="6" height="2" rx="1" fill="#facc15" opacity="0.9"/>
</svg>