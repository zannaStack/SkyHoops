<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 36" width="46" height="36">
<defs>
  <!-- Sfumatura Pelle Calda Tanned / Caricatura -->
  <linearGradient id="skinBase" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#fed7aa" />
    <stop offset="40%" stop-color="#fb923c" />
    <stop offset="85%" stop-color="#ea580c" />
    <stop offset="100%" stop-color="#c2410c" />
  </linearGradient>
  <linearGradient id="skinShadow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ea580c" />
    <stop offset="70%" stop-color="#c2410c" />
    <stop offset="100%" stop-color="#9a3412" />
  </linearGradient>
  <linearGradient id="skinHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8"/>
    <stop offset="100%" stop-color="#fed7aa" stop-opacity="0.1"/>
  </linearGradient>

  <!-- Bordo Oro / Giallo Caldo -->
  <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#fef08a" />
    <stop offset="35%" stop-color="#facc15" />
    <stop offset="80%" stop-color="#eab308" />
    <stop offset="100%" stop-color="#ca8a04" />
  </linearGradient>

  <!-- Gocce di Sudore Cristalline -->
  <linearGradient id="sweatDrop" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
    <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.85" />
    <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.7" />
  </linearGradient>

  <!-- Ginocchiera e Guanti Sportivi Neri -->
  <linearGradient id="gearBlack" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#3f3f46" />
    <stop offset="55%" stop-color="#27272a" />
    <stop offset="100%" stop-color="#18181b" />
  </linearGradient>
</defs>

  <!-- Spalla posteriore / Deltoide (Perno di rotazione a cx=10, cy=10) -->
  <circle cx="10" cy="10" r="7" fill="url(#skinShadow)" stroke="#7c2d12" stroke-width="1"/>

  <!-- Bicipite posteriore che scende e va in avanti verso il gomito -->
  <path d="M 9 16 Q 16 22 23 20 Q 25 15 17 9 L 10 7 Z" fill="url(#skinShadow)" stroke="#7c2d12" stroke-width="1"/>
  <!-- Luce muscolare bicipite -->
  <path d="M 12 12 Q 17 16 20 14" stroke="url(#skinHighlight)" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- Gomito piegato a 90° -->
  <circle cx="23" cy="20" r="5" fill="url(#skinShadow)" stroke="#7c2d12" stroke-width="0.8"/>

  <!-- Avambraccio posteriore che sale in avanti con pugno chiuso -->
  <path d="M 21 23 Q 28 20 34 14 Q 32 9 24 16 Z" fill="url(#skinShadow)" stroke="#7c2d12" stroke-width="1"/>

  <!-- Polsino guanto nero posteriore -->
  <path d="M 29 17 L 34 13 L 37 16 L 32 20 Z" fill="url(#gearBlack)" stroke="#09090b" stroke-width="0.8"/>

  <!-- Guanto nero con pugno chiuso rivolto in avanti (come nella caricatura) -->
  <path d="M 33 13 Q 36 8 41 10 Q 44 14 41 18 Q 36 20 33 15 Z" fill="url(#gearBlack)" stroke="#09090b" stroke-width="1.2"/>
  <!-- Inserto oro sul dorso del guanto -->
  <rect x="35" y="11" width="4.5" height="4" rx="1.2" fill="url(#goldTrim)" transform="rotate(-15 35 11)"/>
  <!-- Nocche e dita strette a pugno -->
  <path d="M 40 10 Q 43 12 42 16" stroke="#52525b" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 38 9 Q 41 11 40 14" stroke="#71717a" stroke-width="0.8" fill="none" stroke-linecap="round"/>

  <!-- Goccia di sudore che si stacca dal braccio in movimento -->
  <path d="M 6 18 Q 4 19 5 21 Q 6 22 7 21 Q 8 19 6 18 Z" fill="url(#sweatDrop)"/>
</svg>
