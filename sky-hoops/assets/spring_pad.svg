<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 50" width="80" height="50">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF3B30"/>
      <stop offset="50%" stop-color="#FF9500"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>
    <linearGradient id="springGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E5E5EA"/>
      <stop offset="100%" stop-color="#8E8E93"/>
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#48484A"/>
      <stop offset="100%" stop-color="#1C1C1E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base anchor plate on ground -->
  <rect x="12" y="42" width="56" height="8" rx="2" fill="url(#baseGrad)" stroke="#636366" stroke-width="1.5"/>
  <circle cx="20" cy="46" r="2" fill="#AEAEB2"/>
  <circle cx="60" cy="46" r="2" fill="#AEAEB2"/>

  <!-- Steel coiled spring -->
  <path d="M 28 42 C 16 38, 16 34, 40 34 C 64 34, 64 30, 28 30 C 16 30, 16 24, 40 24 C 64 24, 64 18, 28 18 C 18 18, 18 14, 38 14" 
        fill="none" stroke="url(#springGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 28 42 C 16 38, 16 34, 40 34 C 64 34, 64 30, 28 30 C 16 30, 16 24, 40 24 C 64 24, 64 18, 28 18 C 18 18, 18 14, 38 14" 
        fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Top Bouncy Launch Plate -->
  <rect x="8" y="6" width="64" height="10" rx="3" fill="url(#plateGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
  <!-- Chevron stripes -->
  <polygon points="20,6 26,6 22,16 16,16" fill="#1C1C1E" opacity="0.4"/>
  <polygon points="34,6 40,6 36,16 30,16" fill="#1C1C1E" opacity="0.4"/>
  <polygon points="48,6 54,6 50,16 44,16" fill="#1C1C1E" opacity="0.4"/>
  <polygon points="62,6 68,6 64,16 58,16" fill="#1C1C1E" opacity="0.4"/>

  <!-- Energy indicator arrows pointing UP -->
  <polygon points="36,4 40,0 44,4" fill="#FFCC00" filter="url(#glow)"/>
  <polygon points="36,4 40,0 44,4" fill="#FFFFFF"/>
</svg>