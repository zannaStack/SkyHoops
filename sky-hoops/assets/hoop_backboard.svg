<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <!-- Palo e braccio di supporto posteriore (a destra) -->
  <line x1="126" y1="50" x2="160" y2="70" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  <line x1="126" y1="110" x2="160" y2="130" stroke="#333" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Tabellone Bianco da Basket (Backboard) -->
  <rect x="114" y="20" width="14" height="120" rx="3" fill="#f8f9fa" stroke="#111" stroke-width="3"/>
  <!-- Rettangolo di mira rosso interno sul tabellone -->
  <rect x="114" y="55" width="14" height="40" fill="#e63946" stroke="#111" stroke-width="2"/>

  <!-- Braccetto di connessione ferro-tabellone -->
  <rect x="94" y="76" width="22" height="8" rx="2" fill="#d90429"/>

  <!-- Ferro Arancione da Basket (Rim) visto di lato/prospettiva -->
  <!-- Anello ellittico da x=30 a x=96 (diametro circa 66px) -->
  <ellipse cx="64" cy="80" rx="34" ry="7" fill="none" stroke="#f77f00" stroke-width="6"/>
  <ellipse cx="64" cy="80" rx="34" ry="7" fill="none" stroke="#d62828" stroke-width="3"/>

  <!-- Retina da Basket Bianca a Maglie incrociate -->
  <g stroke="#ffffff" stroke-width="2" fill="none" opacity="0.9">
    <!-- Fili verticali a imbuto -->
    <path d="M 32 82 L 44 135"/>
    <path d="M 46 84 L 52 136"/>
    <path d="M 64 85 L 64 137"/>
    <path d="M 82 84 L 76 136"/>
    <path d="M 96 82 L 84 135"/>
    
    <!-- Maglie orizzontali incrociate -->
    <ellipse cx="64" cy="98" rx="26" ry="5"/>
    <ellipse cx="64" cy="116" rx="20" ry="4"/>
    <ellipse cx="64" cy="136" rx="14" ry="3"/>
  </g>
</svg>
