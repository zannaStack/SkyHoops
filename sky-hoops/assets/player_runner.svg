  <path d="M 46 75 L 30 95 L 20 90" stroke="#1d3557" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Scarpa posteriore -->
  <ellipse cx="18" cy="90" rx="7" ry="4" fill="#e63946"/>

  <!-- Gamba anteriore in slancio -->
