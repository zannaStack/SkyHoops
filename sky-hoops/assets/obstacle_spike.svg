<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 40" width="60" height="40">
  <defs>
    <linearGradient id="spikeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a4e69" />
      <stop offset="50%" stop-color="#22223b" />
      <stop offset="100%" stop-color="#191924" />
    </linearGradient>
    <linearGradient id="tipGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d6d" />
      <stop offset="100%" stop-color="#c9184a" />
    </linearGradient>
  </defs>

  <!-- Base rocciosa di supporto -->
  <path d="M 4 38 L 56 38 L 50 32 L 10 32 Z" fill="#1f1f2e" />

  <!-- Spuntone Sinistro -->
  <polygon points="12,35 18,12 24,35" fill="url(#spikeGrad)" stroke="#111" stroke-width="1.5" />
  <polygon points="17,17 18,12 21,20" fill="url(#tipGrad)" />

  <!-- Spuntone Centrale Alto e Minaccioso -->
  <polygon points="22,35 30,2 38,35" fill="url(#spikeGrad)" stroke="#111" stroke-width="1.8" />
  <polygon points="28,10 30,2 34,14" fill="url(#tipGrad)" />

  <!-- Spuntone Destro -->
  <polygon points="36,35 44,14 50,35" fill="url(#spikeGrad)" stroke="#111" stroke-width="1.5" />
  <polygon points="43,18 44,14 47,21" fill="url(#tipGrad)" />

  <!-- Segnale di pericolo strisce gialle/nere alla base -->
  <rect x="14" y="33" width="32" height="4" fill="#ffb703" rx="1" />
  <line x1="22" y1="33" x2="25" y2="37" stroke="#111" stroke-width="2" />
  <line x1="30" y1="33" x2="33" y2="37" stroke="#111" stroke-width="2" />
  <line x1="38" y1="33" x2="41" y2="37" stroke="#111" stroke-width="2" />
</svg>